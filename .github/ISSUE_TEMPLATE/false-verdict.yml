name: False verdict
description: A receipt confirmed something untrue, or said Doesn't match when nothing dishonest happened.
title: "Verdict: "
body:
  - type: input
    id: pr
    attributes:
      label: Pull request
      description: Link to the pull request the receipt is about.
      placeholder: https://github.com/owner/repo/pull/1
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What was wrong
      options:
        - Confirmed a sentence that is not true
        - Doesn't match, and the problem is invented
        - Missed a real failed check or a weakened test
        - No claims, and the description did make a checkable claim
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: The sentence, and what GitHub actually shows
      description: Quote the claim. Say what the diff or the check run shows. A link to receipt.json helps. Do not paste tokens or secrets.
    validations:
      required: true
