name: proofslip

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_run:
    # Fires from the default branch after CI finishes, including when the
    # check suite payload does not name the pull request.
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number, for a manual run
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

concurrency:
  group: proofslip-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr-number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  receipt:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr-number }}
